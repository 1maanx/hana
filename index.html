<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hana's Journey</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg1:#a3e4d7; --bg2:#d1f2eb; --card:#f7f9f9;
      --ink:#2c3e50; --accent:#148f77; --soft:#e8f8f5;
    }
    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family:'Quicksand', system-ui, -apple-system, BlinkMacSystemFont;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow-x:hidden;

      /* app-like + safe-area */
      padding: max(14px, env(safe-area-inset-top)) 12px
               max(16px, env(safe-area-inset-bottom));
      color: var(--ink);
    }

    .app{
      width:100%;
      max-width: clamp(520px, 80vw, 1200px);
      margin:0 auto;
    }

    .card{
      background:var(--card);
      border-radius:22px;
      box-shadow:0 10px 26px rgba(0,0,0,.12);
      padding:14px 14px 18px;
    }

    /* Header inside card */
    .card-header{
      text-align:center;
      padding:8px 6px 14px;
    }
    .card-header h1{
      margin:4px 0 6px;
      font-size:clamp(1.6rem, 3vw + 1rem, 2.2rem);
      color:var(--accent);
      font-weight:700;
    }
    .card-header .meta{
      margin:0;
      font-size:1.05rem;
      opacity:.85;
    }

    /* ===== 1-col mobile default ===== */
    .layout{ display:block; }

    /* Slider */
    .slider{
      width:100%;
      aspect-ratio:4/3;         /* mobile/tablet */
      border-radius:16px;
      overflow:hidden;
      background:#eee;
      position:relative;
      margin-bottom:12px;
      user-select:none;
      touch-action:pan-y;
      cursor: zoom-in;
    }
    .slider img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transition:opacity .25s ease;
      -webkit-user-drag:none;
    }

    /* Dots */
    .dots{
      position:absolute;
      left:0; right:0;
      bottom:10px;
      display:flex;
      justify-content:center;
      gap:.45rem;
      padding:0 10px;
      pointer-events:auto;
    }
    .dot{
      width:9px;height:9px;
      border-radius:50%;
      border:0;
      background:rgba(255,255,255,.55);
      cursor:pointer;
      padding:0;
    }
    .dot[aria-current="true"]{
      background:rgba(255,255,255,.95);
    }

    #result,#subresult{
      margin-top:10px;
      padding:12px;
      background:var(--soft);
      border-radius:12px;
      font-weight:600;
    }
    #result{ font-size:1.2rem; }
    #subresult{ font-size:1rem; opacity:.9; }
    .big{ font-size:1.8rem; font-weight:700; }

    .progress{ margin-top:14px; }
    .progress-label{ font-size:.9rem; opacity:.75; margin-bottom:4px; }
    .bar{
      height:10px;
      background:#e6e8eb;
      border-radius:999px;
      overflow:hidden;
    }
    .bar span{
      height:100%;
      display:block;
      background:linear-gradient(90deg,#8fd3c6,#55c6b0);
      width:0%;
      transition:width .4s ease;
    }

    /* ===== Desktop: 2 columns + 16:9 slider ===== */
    @media (min-width: 1024px){
      .layout{
        display:grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap:16px;
        align-items:start;
      }
      .slider{
        aspect-ratio:16/9;      /* PC album look */
        margin-bottom:0;
      }
      .right #result,
      .right #subresult{
        margin-top:0;
      }
    }

    /* Lightbox */
    .lightbox{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:16px;
    }
    .lightbox.open{ display:flex; }
    .lightbox img{
      max-width:100%;
      max-height:90vh;
      border-radius:14px;
      background:#000;
      object-fit:contain;
    }
    .lb-close{
      position:absolute;
      top:14px; right:14px;
      border:0;
      background:#fff;
      border-radius:50%;
      width:36px;height:36px;
      font-size:20px;
      cursor:pointer;
    }
    body.noscroll{ overflow:hidden; }
  </style>
</head>

<body>
<div class="app">
  <main class="card">

    <header class="card-header">
      <h1>Hana's Journey</h1>
      <p class="meta">Birthdate: <strong>17:35, 29/01/2025</strong></p>
    </header>

    <div class="layout">
      <div class="left">
        <div class="slider" id="slider">
          <img id="slideImage" alt="Hana photo" loading="lazy" decoding="async">
          <div class="dots" id="dots"></div>
        </div>
      </div>

      <div class="right">
        <div id="result"></div>
        <div id="subresult"></div>
        <div class="progress">
          <div class="progress-label" id="progressLabel"></div>
          <div class="bar"><span id="barFill"></span></div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <img id="lbImg" alt="Hana photo large">
</div>

<script>
/* ===== Age ===== */
const birth = new Date('2025-01-29T17:35:00+07:00');
const resultDiv = document.getElementById('result');
const subDiv = document.getElementById('subresult');
const barFill = document.getElementById('barFill');
const progressLabel = document.getElementById('progressLabel');

const daysBetween=(a,b)=>Math.floor((b-a)/86400000);

function monthsAndDays(from,to){
  let m=(to.getFullYear()-from.getFullYear())*12+(to.getMonth()-from.getMonth());
  let d=to.getDate()-from.getDate();
  if(d<0){
    m--;
    d+=new Date(to.getFullYear(),to.getMonth(),0).getDate();
  }
  return{months:m,days:d};
}

function nextMonth(base,now){
  let y=now.getFullYear(),m=now.getMonth();
  let d=Math.min(base.getDate(),new Date(y,m+1,0).getDate());
  let t=new Date(y,m,d,base.getHours(),base.getMinutes());
  if(t<=now) t=new Date(y,m+1,d,base.getHours(),base.getMinutes());
  return t;
}

function updateAge(){
  const now=new Date();
  const days=daysBetween(birth,now);
  const md=monthsAndDays(birth,now);

  resultDiv.innerHTML=`Hana is <span class="big">${days}</span> days old`;
  subDiv.textContent=`${md.months} months and ${md.days} days`;

  const next=nextMonth(birth,now);
  const prev=new Date(next); prev.setMonth(prev.getMonth()-1);
  const pct=Math.round(((now-prev)/(next-prev))*100);
  barFill.style.width=pct+'%';
  progressLabel.textContent=`Progress to next month: ${pct}%`;
}

/* ===== Slider (cache + preload prev & next) ===== */
const slider=document.getElementById('slider');
const slideImg=document.getElementById('slideImage');
const dotsWrap=document.getElementById('dots');

let slides=[],idx=0;
const preloaded=new Set();

function preload(url){
  if(!url || preloaded.has(url)) return;
  preloaded.add(url);
  const i=new Image();
  i.decoding = 'async';
  i.src=url;
}
function preloadNeighbors(i){
  if(slides.length<2) return;
  preload(slides[(i-1+slides.length)%slides.length]);
  preload(slides[(i+1)%slides.length]);
}

async function loadSlides(){
  try{
    const r=await fetch('./slides.json',{cache:'default'});
    const data=await r.json();
    slides = Array.isArray(data) && data.length ? data : ['images/slides/placeholder.jpg'];
  }catch{
    slides=['images/slides/placeholder.jpg'];
  }
  renderDots();
  show(0);
  auto();
}

function renderDots(){
  dotsWrap.innerHTML='';
  slides.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='dot';
    b.type='button';
    b.setAttribute('aria-current', String(i===idx));
    b.onclick=e=>{ e.stopPropagation(); show(i,true); };
    dotsWrap.appendChild(b);
  });
}

function updateDots(){
  [...dotsWrap.children].forEach((d,n)=>d.setAttribute('aria-current', String(n===idx)));
}

function show(i,user=false){
  idx=(i+slides.length)%slides.length;

  slideImg.style.opacity=0;
  setTimeout(()=>{
    slideImg.src=slides[idx];
    slideImg.onload=()=>slideImg.style.opacity=1;
  },120);

  updateDots();
  preloadNeighbors(idx);

  if(user) auto(); // restart interval after manual change
}

let autoTimer;
function auto(){
  clearInterval(autoTimer);
  if(slides.length>1){
    autoTimer=setInterval(()=>show(idx+1),4000);
  }
}

/* swipe */
let sx=0;
slider.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
slider.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>40) show(idx-1,true);
  if(dx<-40) show(idx+1,true);
},{passive:true});

/* ===== Lightbox ===== */
const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
const lbClose=document.getElementById('lbClose');

slider.onclick=()=>{
  lbImg.src=slides[idx];
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden','false');
  document.body.classList.add('noscroll');
};
lbClose.onclick=()=>{
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden','true');
  document.body.classList.remove('noscroll');
};
lightbox.onclick=e=>{
  if(e.target===lightbox) lbClose.onclick();
};
document.addEventListener('keydown',(e)=>{
  if(!lightbox.classList.contains('open')) return;
  if(e.key==='Escape') lbClose.onclick();
});

/* ===== Kick off ===== */
updateAge();
setInterval(updateAge,30000);
loadSlides();
</script>
</body>
</html>
