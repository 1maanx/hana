<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Hành Trình Của Bé 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #A3E4D7, #D1F2EB);
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: #F7F9F9;
            border-radius: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            width: 400px;
            margin: 1rem;
        }
        h1 {
            color: #148F77;
            font-size: 2rem;
            margin-bottom: 1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        p {
            font-size: 1.2rem;
            color: #2C3E50;
            margin: 0.5rem 0;
        }
        #result {
            margin-top: 1.5rem;
            font-size: 1.3rem;
            color: #2C3E50;
            font-weight: 700;
            background-color: #E8F8F5;
            padding: 1rem;
            border-radius: 10px;
            animation: fadeIn 0.5s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
            .container {
                padding: 1.5rem;
                width: 90%;
            }
            p, #result {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Hành Trình Của Bé 🌟</h1>
        <p>Ngày sinh bé yêu: <strong>17:35, 29/01/2025</strong> 💕</p>
        <div id="result"></div>
    </div>

    <script>
        window.onload = function() {
            const birthdate = new Date('2025-01-29T17:35:00+07:00');
            const today = new Date('2025-09-11T19:10:00+07:00'); // Cập nhật thời gian
            const timeDiff = today - birthdate;
            const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

            const resultDiv = document.getElementById('result');
            if (daysDiff < 0) {
                resultDiv.innerText = 'Hihi, ngày sinh không hợp lệ nha! 😜';
            } else {
                resultDiv.innerText = `Bé yêu đã được ${daysDiff} ngày tuổi rồi! 🎈`;
            }
        };
    </script>
</body>
</html>
