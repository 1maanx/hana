<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌟 Hana's Journey 🌟</title>

  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg1:#a3e4d7; --bg2:#d1f2eb; --card:#f7f9f9;
      --ink:#2c3e50; --accent:#148f77;
      --soft:#e8f8f5; --pill:#d6efe9;
    }

    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      display:grid; place-items:center;
      font-family:'Quicksand','Comic Neue',cursive;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
    }

    .container{
      width:min(480px,92vw);
      background:var(--card);
      padding:2.2rem 1.6rem;
      border-radius:22px;
      text-align:center;
      box-shadow:0 10px 24px rgba(0,0,0,.15);
      border:2px solid #ecf9f6;
    }

    h1{margin:0 0 .4rem;color:var(--accent)}
    .meta{margin:0 0 .6rem;color:var(--ink)}
    .badge{
      display:inline-flex;gap:.4rem;
      padding:.35rem .7rem;
      border-radius:999px;
      background:var(--pill);
      font-weight:600;color:var(--accent);
    }

    /* Slider */
    .slider{
      margin:1rem auto;
      width:100%; aspect-ratio:4/3;
      border-radius:18px;
      overflow:hidden;
      background:#eefaf7;
      box-shadow:0 6px 16px rgba(0,0,0,.12);
      position:relative;
    }
    .slider img{
      width:100%; height:100%;
      object-fit:cover;
      transition:opacity .45s ease;
      display:block;
    }

    #result,#subresult{
      margin-top:1rem;
      padding:1rem;
      background:var(--soft);
      border-radius:12px;
      font-weight:700;
      color:var(--ink);
    }
    #result{font-size:1.35rem}
    #subresult{font-size:1.1rem;opacity:.95}
    .big{font-size:2rem}

    .progress{margin-top:1rem;text-align:left}
    .progress-label{font-size:.9rem;margin-bottom:.35rem}
    .bar{
      height:12px;
      background:#e9f7f3;
      border-radius:999px;
      overflow:hidden;
    }
    .bar span{
      height:100%; display:block;
      background:linear-gradient(90deg,#8fd3c6,#55c6b0);
      width:0%; transition:width .8s ease;
    }

    /* Balloons */
    .balloons{position:fixed;inset:0;pointer-events:none}
    .balloon{
      position:absolute;bottom:-120px;
      font-size:26px;opacity:.85;
    }
    @keyframes rise{
      to{transform:translateY(-110vh);opacity:1}
    }

    @media(max-width:600px){
      #result{font-size:1.2rem}
      #subresult{font-size:1rem}
    }
  </style>
</head>
<body>

<div class="balloons" id="balloons"></div>

<main class="container">
  <h1>🌟 Hana's Journey 🌟</h1>
  <p class="meta">Hana's birthdate: <strong>17:35, 29/01/2025</strong> 💕</p>
  <span class="badge">⏰ Now: <span id="nowText">—</span></span>

  <!-- Slider -->
  <div class="slider">
    <img id="slideImage" alt="Hana memory" loading="lazy">
  </div>

  <div id="result">Calculating…</div>
  <div id="subresult"></div>

  <div class="progress">
    <div class="progress-label" id="progressLabel"></div>
    <div class="bar"><span id="barFill"></span></div>
  </div>
</main>

<script>
/* ===== Date logic ===== */
const birth = new Date('2025-01-29T17:35:00+07:00');
const nowText = document.getElementById('nowText');
const resultDiv = document.getElementById('result');
const subDiv = document.getElementById('subresult');
const barFill = document.getElementById('barFill');
const progressLabel = document.getElementById('progressLabel');

const pad = n => String(n).padStart(2,'0');
const daysBetween=(a,b)=>Math.floor((b-a)/86400000);

function monthsAndDays(from,to){
  let y=to.getFullYear(), m=to.getMonth();
  let months=(y-from.getFullYear())*12+(m-from.getMonth());
  let days=to.getDate()-from.getDate();
  if(days<0){
    months--;
    const prev=new Date(y,m,0);
    days=prev.getDate()+days;
  }
  return{months,days};
}

function nextMonthAnniversary(base,now){
  let y=now.getFullYear(),m=now.getMonth();
  let d=Math.min(base.getDate(),new Date(y,m+1,0).getDate());
  let cand=new Date(y,m,d,base.getHours(),base.getMinutes());
  if(cand<=now) cand=new Date(y,m+1,d,base.getHours(),base.getMinutes());
  return cand;
}

function update(){
  const now=new Date();
  nowText.textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}, ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;

  const totalDays=daysBetween(birth,now);
  const {months,days}=monthsAndDays(birth,now);

  resultDiv.innerHTML=`Hana is <span class="big">${totalDays}</span> days old! 🎈`;
  subDiv.innerHTML=`That's <strong>${months}</strong> months and <strong>${days}</strong> days. 🧸`;

  const next=nextMonthAnniversary(birth,now);
  const prev=new Date(next); prev.setMonth(prev.getMonth()-1);
  const pct=Math.round(((now-prev)/(next-prev))*100);
  barFill.style.width=pct+'%';
  progressLabel.textContent=`Progress to next month: ${pct}%`;
}

/* ===== Slider ===== */
const slideImg=document.getElementById('slideImage');
let slides=[],idx=0;

async function loadSlides(){
  try{
    const r=await fetch('./slides.json',{cache:'no-store'});
    slides=await r.json();
    slideImg.src=slides[0];
    setInterval(()=>{idx=(idx+1)%slides.length;slideImg.style.opacity=0;
      setTimeout(()=>{slideImg.src=slides[idx];slideImg.style.opacity=1},200);
    },4000);
  }catch{
    slideImg.src='images/slides/placeholder.jpg';
  }
}

/* ===== Balloons ===== */
const wrap=document.getElementById('balloons');
function pop(count=10){
  for(let i=0;i<count;i++){
    const b=document.createElement('span');
    b.className='balloon';
    b.textContent=['🎈','💖','🧸','🎀'][Math.random()*4|0];
    b.style.left=Math.random()*100+'vw';
    b.style.animation=`rise ${5+Math.random()*5}s linear forwards`;
    wrap.appendChild(b);
    setTimeout(()=>b.remove(),7000);
  }
}

update(); loadSlides(); pop(12);
setInterval(update,30000);
</script>
</body>
</html>
